function parseCSV(text){let rows=[],r=[],v='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){v+='"';i++}else q=!q}else if(!q&&(c===','||c==='\n')){r.push(v.replace(/\r$/,''));v='';if(c==='\n'){if(r.some(Boolean))rows.push(r);r=[]}}else v+=c}r.push(v.replace(/\r$/,''));if(r.some(Boolean))rows.push(r);return rows}
$('files').onchange=async()=>{pending=null;$('apply').disabled=true;try{let out=[],seen=new Set(),messages=[];for(let f of $('files').files){let rows=parseCSV((await f.text()).replace(/^\uFEFF/,'')),headers=rows.shift(),fields=['Production','To Building','To Grid','Consumption','From Solar','From Grid'];let indices=fields.map(k=>headers.findIndex(h=>h===k+' (kW)'||h===k+' (MW)'));if(headers[0]!=='Measurement Time'||indices.includes(-1))throw Error(f.name+': รูปแบบ CSV ไม่รองรับ');let groups={};for(let r of rows){let date=new Date(r[0]);if(isNaN(date))throw Error('วันที่หรือเวลาไม่ถูกต้อง');let stamp=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;if(date.getMinutes()%15||date.getSeconds()||seen.has(stamp))throw Error('เวลาซ้ำหรือไม่ตรงช่วง 15 นาที: '+stamp);seen.add(stamp);let vals=indices.map(i=>{let value=Number(r[i]);if(r[i]===''||!Number.isFinite(value)||value<0)throw Error('ค่ากำลังไฟไม่ถูกต้อง');return value*(headers[i].includes('(MW)')?1000:1)});let key=stamp.slice(0,13)+':00:00';(groups[key]??=[]).push(vals)}let days={};for(let key in groups){let a=groups[key];if(a.length!==4)throw Error('ข้อมูลรายชั่วโมงไม่ครบ: '+key);days[key.slice(0,10)]=(days[key.slice(0,10)]||0)+4;let o={timestamp:key,sample_count:4};fields.forEach((k,i)=>{o[k+'_mean_kW']=a.reduce((sum,v)=>sum+v[i],0)/4;o[k+'_estimated_kWh']=o[k+'_mean_kW']});out.push(o)}for(let day in days){if(days[day]!==96)throw Error('ข้อมูลรายวันไม่ครบ: '+day);messages.push(f.name+' → '+day+' · 96 จุด / 24 ชั่วโมง')}}if(!out.length)throw Error('ไม่พบข้อมูล');pending=out;$('preview').textContent=messages.join('\n')+'\n'+t('พร้อม แทนข้อมูลวันที่ตรงกัน','พร้อม แทนข้อมูลวันที่ตรงกัน');$('apply').disabled=false}catch(e){$('preview').textContent=e.message}};
